# Supabase local configuration. Project_id is per-developer; secret values
# (anon/service keys, JWT secret) live outside this file.

project_id = "renteo"

[api]
enabled = true
port = 54321
schemas = ["public", "app", "core", "tax_params", "tax_data", "tax_calc", "security", "privacy", "tax_rules"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# ⚠️ DEMO CERRADO — este archivo gobierna el stack LOCAL, no el proyecto cloud.
#
# `enable_signup` queda en `true` acá a propósito: los tests e2e
# (apps/web/e2e/golden-flow.spec.ts) registran usuarios, y cerrarlo local los
# rompe. En PRODUCCIÓN el signup debe estar CERRADO desde el dashboard de
# Supabase (Authentication → Providers → Email → "Enable sign-ups" = off).
# Paso obligatorio del runbook: docs/DEMO-PROD.md.
#
# Aun así, el gate REAL no es este: es la allowlist `ALLOWED_USER_EMAILS`, que
# se aplica en `verify_jwt` (apps/api/src/auth/jwt.py). Aunque alguien lograra
# registrarse en prod, recibiría 403 en todo endpoint autenticado. El cierre del
# signup es defensa en profundidad, no la única barrera.
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Custom Access Token Hook: puebla app_metadata.{workspace_id, workspace_type,
# role, empresa_ids} en el JWT al firmar/refrescar tokens. Definido en
# migrations/20260429120000_auth_hook.sql.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = false
