# =============================================================================
# legal-dependencies.yaml — mantenido por el contador socio.
# =============================================================================
#
# Mapeo bidireccional regla ↔ fuentes legales que la sustentan. Cuando se
# publica una ley/circular nueva, el watchdog legislativo (fase 5) cruza este
# archivo para responder en menos de 1 minuto:
#
#   "Esta semana publicaron Circular SII N° X. Reglas potencialmente afectadas:"
#   → [...]
#
# Espejado en la tabla tax_rules.legal_dependencies. La fuente de verdad es
# este archivo (controlado en git con review por contador socio); la tabla se
# refresca via migración versionada al actualizarlo.
#
# Estructura de cada entrada:
#
#   - rule_set:
#       domain: regime_eligibility | palanca_definition | red_flag
#               | rli_formula | credit_imputation_order | idpc_rate | ...
#       key:    identificador estable dentro del dominio
#               (ej. "14_d_3", "dep_instantanea")
#     depends_on:
#       - tipo: ley | decreto | circular_sii | oficio_sii | resolucion_sii
#               | jurisprudencia_tta | cs
#         id:   identificador (número de ley/circular/oficio)
#         articulo: opcional, "art. 31 N°5 bis"
#
# Ejemplo (NO cargar como real hasta firma de contador socio):
#
#   - rule_set:
#       domain: regime_eligibility
#       key: 14_d_3
#     depends_on:
#       - { tipo: ley, id: "21.210" }
#       - { tipo: ley, id: "21.713" }
#       - { tipo: circular_sii, id: "62/2020" }
#
#   - rule_set:
#       domain: idpc_rate
#       key: 14_d_3_at2026
#     depends_on:
#       - { tipo: ley, id: "21.755" }
#       - { tipo: circular_sii, id: "53/2025" }
#       - { tipo: ley, id: "21.735", articulo: "art. 4° transitorio" }
#
# =============================================================================

dependencies:
  # ── red_flag: optimizador de gasto del giro (art. 31 LIR) ──────────────────
  # Espejo de supabase/migrations/20260713120000_red_flags_gasto_giro.sql.
  # Diseño y fundamento verificado: docs/optimizadores/01-gasto-del-giro.md.
  # Solo bloquean/advierten: ninguna habilita una recomendación.

  - rule_set:
      domain: red_flag
      key: gasto_personal
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inc. 1°" }
      - { tipo: circular_sii, id: "53/2020" }

  - rule_set:
      domain: red_flag
      key: sin_nexo_giro
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inc. 1°" }
      - { tipo: circular_sii, id: "53/2020" }

  - rule_set:
      domain: red_flag
      key: vehiculo_automovil_fuera_de_giro
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inc. 1°" }
      - { tipo: circular_sii, id: "53/2020" }

  - rule_set:
      domain: red_flag
      key: transaccion_o_clausula_penal_con_relacionado
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inciso final" }

  - rule_set:
      domain: red_flag
      key: pago_exterior_art59_relacionado_sin_impuesto_adicional
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inc. 3°" }

  - rule_set:
      domain: red_flag
      key: fraccionamiento_para_eludir_umbral
    depends_on:
      - { tipo: decreto, id: "830", articulo: "art. 4 bis" }
      - { tipo: decreto, id: "830", articulo: "art. 4 ter" }
      - { tipo: circular_sii, id: "31/2025" }

  - rule_set:
      domain: red_flag
      key: sin_documento_tributario
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inc. 1°" }
      - { tipo: decreto, id: "830", articulo: "art. 21" }
      - { tipo: decreto, id: "825", articulo: "art. 23" }

  - rule_set:
      domain: red_flag
      key: gasto_extranjero_documento_incompleto
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inc. 2°" }
      - { tipo: circular_sii, id: "53/2020" }

  - rule_set:
      domain: red_flag
      key: pago_exterior_art59_relacionado_tope
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 N°12" }

  - rule_set:
      domain: red_flag
      key: credito_incobrable_con_relacionado
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 N°4" }
      - { tipo: decreto, id: "830", articulo: "art. 8 N°17" }

  - rule_set:
      domain: red_flag
      key: compra_en_supermercado_caso_a_caso
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 inc. 1°" }
      - { tipo: circular_sii, id: "53/2020", articulo: "§2.4" }

  - rule_set:
      domain: red_flag
      key: donacion_limites_en_cascada
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 31 N°7" }
      - { tipo: ley, id: "19.885", articulo: "art. 10" }

  - rule_set:
      domain: red_flag
      key: egreso_no_pagado_en_base_caja
    depends_on:
      - { tipo: ley, id: "21.210", articulo: "art. 14 D N°3" }
      - { tipo: circular_sii, id: "62/2020" }
